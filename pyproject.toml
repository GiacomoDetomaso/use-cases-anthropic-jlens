[project]
name = "use-cases-anthropic-jlens"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Giacomo Detomaso", email = "giacomodetomaso24@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "accelerate",
    "fsspec",
    "grandalf",
    "huggingface-hub",
    "imbalanced-learn>=0.14.2",
    "jlens",
    "langchain==1.3.14",
    "langchain-core==1.5.4",
    "langchain-openai==1.4.3",
    "langgraph==1.2.9",
    "langgraph-checkpoint-sqlite",
    "loguru",
    "mlflow>=3.15.2",
    "openai==2.54.0",
    "pandas",
    "pyarrow",
    "pydantic==2.13.4",
    "PyYAML",
    "requests",
    "scikit-learn>=1.9.0",
    "sentence-transformers",
]

[project.optional-dependencies]
vllm = [
    "vllm",
]

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["app", "dataset_agent", "training"]

[tool.uv.sources]
jlens = { git = "https://github.com/anthropics/jacobian-lens.git" }

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pandas-stubs",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
    "types-PyYAML",
]

[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
]
ignore = [
    "E501",   # line too long (handled by formatter)
]
[tool.ruff.lint.isort]
known-first-party = ["dataset_agent", "training"]
[tool.mypy]
python_version = "3.12"
exclude = ["^tests/", "^jlens_control_plane\\.py$"]
strict = false
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
