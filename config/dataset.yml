source_dataset:
  input_source: "hf://datasets/bitext/Bitext-customer-support-llm-chatbot-training-dataset/Bitext_Sample_Customer_Support_Training_Dataset_27K_responses-v11.csv"
  class_labels: ["cancel_order", "change_order", "change_shipping_address", "check_cancellation_fee", "check_invoice", "check_payment_methods", "check_refund_policy", "complaint", "contact_customer_service", "contact_human_agent", "create_account", "delete_account", "delivery_options", "delivery_period", "edit_account", "get_invoice", "get_refund", "newsletter_subscription", "payment_issue", "place_order", "recover_password", "registration_problems", "review", "set_up_shipping_address", "switch_account", "track_order", "track_refund"]
  data_col_name: "instruction"
  label_col_name: "intent"
  class_distribution: "balanced" 


target_transformation_examples_dataset:
  input_source: "hf://datasets/neuralchemy/Prompt-injection-dataset/full/train-00000-of-00001.parquet"
  class_labels: ["adversarial", "jailbreak", "encoding", "direct_injection", "system_manipulation"]
  data_col_name: "text"
  label_col_name: "category"
  class_distribution:
    direct_injection: 40
    adversarial: 20
    jailbreak: 20
    encoding: 15
    system_manipulation: 5
  class_descriptions:
    adversarial: "Attempts to make the recipient execute attacker-supplied code or commands."
    jailbreak: "Attempts to bypass or disable the model's safety rules, restrictions, or refusal behavior."
    encoding: "Uses encoding, obfuscation, character substitution, or transformed representations to conceal an instruction, command, or adversarial payload."
    direct_injection: "Directly gives the recipient a malicious instruction intended to override, redirect, or constrain its behavior or response."
    system_manipulation: "Impersonates or fabricates higher-priority system, developer, administrator, or control messages to make the recipient treat attacker instructions as authoritative."
    
output_dataset:
  target_size: 50
  name: "bitext-malicious"