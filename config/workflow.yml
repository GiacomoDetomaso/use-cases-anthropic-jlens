generation_schema_fix_retries: 2
workers: 1
save_checks: 50 

inference:
  mode: "vllm" # either vllm or no_inference_engine
  vllm: 
    invoke_mode: "sync"
    health_sleep_seconds: 10
    warmup_step: True
    vllm_params:
      - name: "port"
        value: 8080
      - name: "gpu-memory-utilization"
        value: 0.80
      - name: "max-model-len"
        value: 4096
      - name: "quantization"
        value: "marlin"
      - name: "tensor-parallel-size"
        value: 2
      - name: "enable-prefix-caching"
        value: True
      - name: "enable-chunked-prefill"
        value: True
