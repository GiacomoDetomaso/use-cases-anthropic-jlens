generation_schema_fix_retries: 3
max_repair_attempts: 3
workers: 10
# Required when workers is greater than 1. Each source class must appear in
# exactly one group, for example: [["cancel_order", "change_order"], ["change_shipping_address"]]
worker_class_groups:
 - ['cancel_order', 'create_account', 'recover_password']
 - ['change_order', 'delete_account', 'registration_problems']
 - ['change_shipping_address', 'delivery_options', 'review']
 - ['check_cancellation_fee', 'delivery_period', 'set_up_shipping_address']
 - ['check_invoice', 'edit_account', 'switch_account']
 - ['check_payment_methods', 'get_invoice', 'track_order']
 - ['check_refund_policy', 'get_refund', 'track_refund']
 - ['complaint', 'newsletter_subscription']
 - ['contact_customer_service', 'payment_issue']
 - ['contact_human_agent', 'place_order']
save_checks: 50 
resume: true

inference:
  invoke_mode: "sync"
  health_sleep_seconds: 10
  warmup_step: True
  vllm_params:
    - name: "port"
      value: 8080
    - name: "gpu-memory-utilization"
      value: 0.85
    - name: "quantization"
      value: "compressed-tensors"
    - name: "max-model-len"
      value: 8192
    - name: "tensor-parallel-size"
      value: 2
    - name: "enable-prefix-caching"
      value: True
    - name: "enable-chunked-prefill"
      value: True
